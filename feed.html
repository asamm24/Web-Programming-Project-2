<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Grabbing Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <title>Slugfest</title>
    </head>
    
    <!-- Added pt-5  -->
    <body class="pt-5">
        
        <!-- Navbar setup -->
        <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="feed.html">SlugFest</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="feed.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Compose</a>
                        </li>
                        
                        <!-- single profile link -->
                        <li class="nav-item">
                            <a class="nav-link" href="kevin.html">Profile</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="notifications.html">Notifications</a>
                        </li>
                    </ul>
                    
                    <!-- search bar  -->
                    <form class="d-flex">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        </div>
                        <button type="button" class="btn btn-info" aria-label="Submit Search"><i class="bi bi-chevron-bar-right"></i></button> 
                    </form>
                </div>
            </div>
        </nav>

        <!-- Main grid setup -->
        <div class="container justify-content-md-center align-self-center mt-4">
            <div class="container justify-content-center row mb-5">
                <div class="col-md-8">
                    <h1 class="text-center mb-5">Welcome to SlugFest</h1>

                    <!-- The compose box -->
                    <div class="container row m-3 pb-3 border-bottom">
                        <div class="col-2">
                            <img src="./assets/profile/kevin.jpeg" alt="Current User" class="img-fluid rounded-circle">
                        </div>
                        <div class="col-10">
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Compose Slime" id="slimeCompose" style="height:5rem;"></textarea>
                                <label for="slimeCompose">Compose Slime</label>
                            </div>
                            <div class="d-flex gap-2 justify-content-end mt-2">
                                <a href="#" class="btn btn-primary">Slime <i class="bi bi-arrow-right-circle"></i></a>  
                            </div>
                        </div>
                    </div>

                    <!-- dump the slime cards right here -->
                    <div id="feed-container"></div>
                </div>
            </div>
        </div>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        
        <!-- Hooking up the JS module to load the API data -->
        <script type="module" src="js/feed.js"></script>
    </body>
</html>
