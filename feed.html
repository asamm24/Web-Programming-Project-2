<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlugFest | Home</title>
    
    <!-- Grabbing Bootstrap 5 so we don't have to write CSS from scratch -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar, I linked this to the notifications page and put the profile pages in a dropdown -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="feed.html">🐌 SlugFest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="feed.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#composeModal"> Compose </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html">Notifications</a>
                    </li>
                    <!-- Dropdown for the 4 profiles -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown">
                            Profiles
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="kevin.html">Kevin Angstadt</a></li>
                            <li><a class="dropdown-item" href="ed.html">Ed Harcourt</a></li>
                            <li><a class="dropdown-item" href="lee.html">Choong-Soo Lee</a></li>
                            <li><a class="dropdown-item" href="lisa.html">Lisa Torrey</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

 <!-- Modal Added -->
     <div class="modal fade" id="composeModal" tabindex="-1" role="dialog" aria-labelledby="composeModalLabel" aria-hidden="true">
        <div class="modal-dialog">
             <div class="modal-content">
                 <div class="modal-header">
                     <h2 class="modal-title" id="composeModalLabel">Compose Slime</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control" rows="3" placeholder="Compose Slime" aria-label="Compose Slime"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary btn-sm">Slime <i class="bi bi-arrow-right-circle"></i></button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main grid setup so the feed looks good on both desktop and mobile -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h3 class="mb-4 fw-bold text-dark">Home Feed</h3>
                
                <!-- loop through the data and dump the slime cards right here. -->
                <div id="feed-container"></div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS so the profile dropdown clicks open -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="js/feed.js"></script>
</body>
</html>
